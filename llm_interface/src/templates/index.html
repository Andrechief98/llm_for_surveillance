<!DOCTYPE html>
<html lang="it">
<head>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurveillanceGPT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #343541;
            margin: 0;
        }

        .chat-container {
            width: 70%;
            max-width: 900px;
            background: #444654;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        .chat-header {
            padding: 10px;
            text-align: center;
            background: #333;
            color: white;
            font-weight: bold;
        }

        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 10px 15px;
            border-radius: 10px;
            margin: 5px 0;
            max-width: 80%;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: #0b93f6;
            color: white;
            align-self: flex-end;
        }

        .bot-message {
            background-color: #40414F;
            color: white;
            align-self: flex-start;
        }

        .data-mediator-message {
            background-color: #f28b82; /* rosso chiaro */
            color: black;
            align-self: center;
            text-align: center;
        }

        .input-container {
            display: flex;
            padding: 10px;
            background: #343541;
            border-top: 1px solid #555;
        }

        input {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            background: #4a4b54;
            color: white;
        }

        button {
            padding: 10px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #0b93f6;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background-color: #0a7cd5;
        }

        .reset-button {
            background-color: #ff4b4b;
        }

        .reset-button:hover {
            background-color: #d93636;
        }
        .popup {
            display: none; /* Inizialmente nascosto */
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .popup button {
            margin-top: 10px;
            align-items: center;
        }
        .button-container {
            display: flex;
            justify-content: center; /* Centra i bottoni orizzontalmente */
            gap: 60px; /* Distanza tra i bottoni */
        }

        .overlay {
            display: none; /* Inizialmente nascosto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            SurveillanceGPT
            <button class="reset-button" onclick="resetChat()">🔄 Reset</button>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const chatBox = document.getElementById("chat-box");

                const initialMessage = `"Hello! How can I assist you today with the surveillance monitoring?"`;
                chatBox.innerHTML += `<div class="message bot-message"><strong>AI:</strong> ${initialMessage}</div>`;;
        
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        </script>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Write a message ..." onkeydown="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <p id="sensor-list"></p>
        <p id="activation-message"></p> 
        <div class="button-container">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <script>
        // Connessione al server Socket.IO
        const socket = io();

        // Ascolta l'evento 'new_message' per aggiornare la chat in tempo reale
        socket.on('new_message', function(message) {
            const chatBox = document.getElementById("chat-box");
            let messageHTML = '';
            
            // Controlla se il contenuto sembra essere una stringa JSON
            try {
                const parsed = JSON.parse(message.content);
                // Se il parsing ha successo, formattiamo il JSON
                const formatted = JSON.stringify(parsed);
                messageHTML = `<div class="message user-message"><strong>You:</strong> ${formatted}</div>`;
            } catch (e) {
                // Se non è JSON, lo stampiamo come testo normale
                if (message.role === "assistant") {
                    const renderedReply = marked.parse(message.content);
                    chatBox.innerHTML += `<div class="message bot-message"><strong>AI:</strong><br>${renderedReply}</div>`;
                } else if (message.role === "system") {
                    messageHTML = `<div class="message bot-message"><strong>Sistema:</strong> ${message.content}</div>`;
                } else if (message.role === "data_mediator") {
                    messageHTML = `<div class="message data-mediator-message"><strong>Data Mediator:</strong> ${message.content}</div>`;
                } else {
                    messageHTML = `<div class="message user-message"><strong>You:</strong> ${message.content}</div>`;
                }
            }
            
            chatBox.innerHTML += messageHTML;
            chatBox.scrollTop = chatBox.scrollHeight; // Scorri in basso
        });

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="message user-message"><strong>You:</strong> ${message}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight; // Scorri in basso

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                if (data.error) {
                    chatBox.innerHTML += `<div class="message bot-message"><strong>AI:</strong> <em>${data.error}</em></div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    return;
                }
                const formattedReply = data.reply.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

                chatBox.innerHTML += `<div class="message bot-message"><strong>AI:</strong> ${formattedReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

                

                // // If there is a final decision, display the popup
                // if (data.final_decision) {
                //     const sensorList = data.activated_sensors.join(", ");
                //     const robotName = data.final_decision
                //     document.getElementById('activation-message').textContent = `Do you want to activate the ${robotName}?`;
                //     document.getElementById("sensor-list").innerText = `Activated sensors: ${sensorList}`;
                //     document.getElementById("popup").style.display = "block";
                //     document.getElementById("overlay").style.display = "block";

                //     document.getElementById("yes-btn").onclick = () => sendActivationCommand("yes");
                //     document.getElementById("no-btn").onclick = () => sendActivationCommand("no");
                // }

            } catch (error) {
                console.error("Errore:", error);
            }
        }

        async function resetChat() {
            const chatBox = document.getElementById("chat-box");
            await fetch("/reset", { method: "POST" });
            chatBox.innerHTML = ""; // Cancella la chat visualizzata
        }
    </script>

</body>
</html>
